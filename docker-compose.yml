services:
  bot:
    build: .
    command: ["node", "dist/bot.js"]
    env_file: .env
    volumes:
      - ./sessions:/app/sessions
    restart: unless-stopped

  api:
    build: .
    command: ["node", "dist/server.js"]
    env_file: .env
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
